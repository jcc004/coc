# CoC app — Nginx site config (HTTP, IP-only).
# Install:
#   sudo cp deploy/nginx-coc.conf /etc/nginx/sites-available/coc
#   sudo ln -sf /etc/nginx/sites-available/coc /etc/nginx/sites-enabled/coc
#   sudo rm -f /etc/nginx/sites-enabled/default
#   chmod o+x /home/jcc            # let Nginx traverse into web/dist
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name 146.190.196.236;

    # Built React SPA
    root /home/jcc/coc/web/dist;
    index index.html;

    # Reasonable ceiling for image uploads (raise if needed for the
    # upload feature being added).
    client_max_body_size 10M;

    # SPA: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> Node (Hono server on :8787)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
