# CoC app — Nginx site config. HTTPS only.
#
# Host: coc.jcciv.com, which resolves to the droplet's reserved IP,
# 146.190.196.236. Inbound only — the CoC API key belongs to the droplet's
# outbound public IP instead. See deploy/README.md.
# If that ever changes, update every occurrence below — server_name appears in
# both blocks and the certificate paths embed it too.
#
# A hostname is not optional here. A browser-trusted certificate cannot be issued
# for a bare IP, so serving on 146.190.196.236 alone would mean a self-signed
# cert and a click-through warning for every user — which trains ten people to
# dismiss TLS warnings and is worse than no TLS at all.
#
# Install:
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx-coc.conf /etc/nginx/sites-available/coc
#   sudo ln -sf /etc/nginx/sites-available/coc /etc/nginx/sites-enabled/coc
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo certbot certonly --webroot -w /var/www/certbot -d coc.jcciv.com
#   sudo nginx -t && sudo systemctl reload nginx

# Do not advertise the exact Nginx version on every response and error page. It is
# not a secret, which is the usual argument for leaving it alone — but it is the
# field somebody scanning for one specific CVE filters on, and removing it costs
# nothing at all.
server_tokens off;

# ---------------------------------------------------------------- request throttling
#
# These sit at file scope rather than inside a server block because `limit_req_zone`
# is only valid in the `http` context, and this file is included from inside
# `http {}` (through sites-enabled) — so this is the one place it can go without
# editing nginx.conf itself.
#
# **The login zone is not optional.** Verifying a password costs the app ~40 ms of
# scrypt, and costs the same whether or not the address exists — that equal cost is
# deliberate, and it is what stops a caller telling a real account from a fake one
# by timing the answer. The consequence is that unthrottled login attempts are a
# denial of service: a few dozen requests a second is enough to stop the app
# answering anything. The app's own limiter cannot close that on its own, because
# its tight bucket is per-email and a caller who rotates throwaway addresses gets a
# fresh one every time. The bound that holds is here, in front, counted against an
# address the caller does not choose.
#
# 10/minute with `burst=5` below, which in practice allows **six** attempts back to
# back before the first 429 — nginx admits the burst *plus* the one the rate itself
# permits, which is worth stating because "burst=5" reads like five. Measured, not
# assumed: 200 200 200 200 200 200 429 429 for eight rapid POSTs.
#
# Six is far above any human — somebody who has genuinely forgotten their password
# makes three or four attempts and stops — and far below the rate at which this
# costs the app anything.
limit_req_zone $binary_remote_addr zone=coc_login:10m rate=10r/m;

# Everything else under /api/ gets a much looser cap, sized against what one page
# render really does rather than against an attack: opening a clan fires the clan,
# members, current-war, war-log and capital-raid calls at once, and the card page
# reads the whole inventory plus the trade list. 20/s with a burst of 50 leaves that
# comfortable while bounding the one cheap thing an authenticated caller could
# otherwise do — filling the server's response cache with distinct search keys.
#
# A whole household or office shares one $binary_remote_addr, so this is the zone to
# loosen if a real user ever meets a 429. Not the login one.
limit_req_zone $binary_remote_addr zone=coc_api:10m rate=20r/s;

# 429 rather than Nginx's default 503. The app already answers 429 with a
# Retry-After when its own lockout trips, so a client sees one status for "too
# fast" instead of two — and a 503 here would read as "the server is down".
limit_req_status 429;

# Port 80 exists only to redirect and to answer ACME challenges — no application
# traffic is ever served over it. It cannot simply be firewalled off: Let's
# Encrypt's HTTP-01 renewal needs it reachable, and a blocked port 80 turns into
# a silent certificate-renewal failure about 60 days later. Use DNS-01 if you
# want 80 closed entirely.
server {
    listen 80;
    listen [::]:80;
    server_name coc.jcciv.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 is requested as a `listen` parameter rather than with the standalone
    # `http2 on;` directive. The standalone form is cleaner but only exists from
    # nginx 1.25.1; on anything older it is an "unknown directive" and `nginx -t`
    # rejects the whole file. This form has worked since 1.9.5 and still works today
    # — deprecated on current nginx, which warns and carries on — so it is the one
    # that does not depend on which nginx the host happens to ship.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name coc.jcciv.com;

    ssl_certificate     /etc/letsencrypt/live/coc.jcciv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coc.jcciv.com/privkey.pem;

    # Certbot ships modern defaults; using them beats hand-rolling a cipher list
    # that ages badly. Both files appear after the first successful issuance.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Tell browsers never to attempt plain http for this host again. Sticky by
    # design: once sent, a browser refuses http for max-age even if Nginx later
    # changes — which is why this started at a day while TLS was being proven out.
    # It has been serving HTTPS reliably since, so it is now a year.
    #
    # `includeSubDomains` is deliberately absent: it would commit every future
    # name under jcciv.com to HTTPS, including ones this app knows nothing about,
    # and that promise is not this file's to make. `preload` is absent for the
    # same reason plus a harder one — getting off the preload list takes months.
    add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # There is no known injection here — the app is React with no
    # `dangerouslySetInnerHTML`, no `innerHTML`, and no `eval` anywhere in the tree
    # — so this is the second layer rather than the fix for something. It matters
    # because the session cookie's `HttpOnly` is otherwise the *only* thing between
    # an XSS bug and somebody else's 30-day session.
    #
    # Each source is here for a reason, and the list is as short as the app allows:
    #
    # - `img-src` needs Supercell's asset host: clan badges always come from
    #   API-supplied CDN URLs, and any league or label icon newer than the last
    #   `npm run assets:coc` falls back to the same place (see coc-assets.ts).
    #   `data:` is for the generated favicon path.
    # - `style-src` needs `'unsafe-inline'` only because 25 components still set an
    #   inline `style={{…}}` attribute, one of them computed (the deck plaque's
    #   width). Move those into styles.css and this can drop to `'self'` — that is
    #   the one real tightening left available here.
    # - `script-src 'self'`: no CDN, no inline script. The bundle is the only script.
    # - `connect-src 'self'`: the browser talks to /api and nothing else. The CoC
    #   token stays server-side, which is the whole reason the proxy exists.
    # - `frame-ancestors 'none'` restates X-Frame-Options for browsers that prefer
    #   CSP, and `base-uri 'none'` stops an injected <base> from re-pointing every
    #   relative URL on the page.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://api-assets.clashofclans.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Built React SPA
    root /srv/coc/web/dist;
    index index.html;

    # Ceiling on any request body, so a client cannot make Nginx buffer an
    # unbounded one. Nothing the app serves comes close — the largest is a
    # whole-base card save, a few hundred bytes of JSON.
    #
    # The app now enforces its own, smaller limit as well, which is what the older
    # version of this comment asked for and could not point at: see the
    # request-size middleware in server/src/app.ts. Two ceilings, and the inner one
    # is the tighter, so raising this alone changes nothing.
    client_max_body_size 10M;

    # Hoisted to the server block so the two /api locations below cannot drift
    # apart — proxy_set_header is inherited, proxy_pass is not.
    proxy_set_header Host $host;
    # The app prefers this header when TRUST_PROXY is set, precisely because Nginx
    # sets it from $remote_addr and a client cannot forge it through the proxy.
    proxy_set_header X-Real-IP $remote_addr;
    # $proxy_add_x_forwarded_for APPENDS the real peer to whatever the client sent,
    # so the trustworthy value is the LAST hop, never the first. The app reads it
    # that way now; it used to read the first, which let a caller pick its own
    # rate-limit bucket by sending a header of its own.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SPA: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # An exact-match location, so it wins over the prefix match below and the login
    # throttle cannot be bypassed by the request landing in the general block.
    location = /api/auth/login {
        limit_req zone=coc_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    # API -> Node (Hono server on :8787)
    location /api/ {
        limit_req zone=coc_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }
}
