# Test on every push, and deploy main to the droplet when the tests pass.
#
# Two jobs on purpose. `verify` is the gate: it runs on every push and every pull
# request, and `deploy` will not start unless it succeeded. A deploy that ships a
# tree whose tests were never run is the thing automation is supposed to remove,
# not add.
#
# The deploy step is a single SSH call to deploy/update.sh on the host. All the
# judgement lives in that script, on the machine that has the context — which
# branch is checked out, whether the artwork is present, what the site is actually
# serving. Keeping the workflow thin means the same deploy can be run by hand,
# identically, when GitHub is unavailable or the runner cannot reach port 22.
#
# ---------------------------------------------------------------------------
# One-time setup before this can work
# ---------------------------------------------------------------------------
#
# 1. A dedicated key for CI, generated on your Mac. Do not reuse a personal key.
#
#      ssh-keygen -t ed25519 -C "github-actions-deploy" -f ~/.ssh/coc-deploy -N ""
#      ssh-copy-id -i ~/.ssh/coc-deploy.pub crighjc@coc.jcciv.com
#
# 2. Repository secrets (Settings -> Secrets and variables -> Actions):
#
#      DEPLOY_SSH_KEY    the *private* key, ~/.ssh/coc-deploy, whole file
#      DEPLOY_HOST       coc.jcciv.com
#      DEPLOY_USER       crighjc
#      DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan coc.jcciv.com
#
#    DEPLOY_KNOWN_HOSTS is not optional. Without it the only alternative is
#    disabling host-key checking, which turns every deploy into an invitation to
#    be handed a different server.
#
# 3. Passwordless restart for that account, since the script is not interactive.
#    Narrow to the two commands it needs — never a blanket NOPASSWD:ALL:
#
#      sudo visudo -f /etc/sudoers.d/coc-deploy
#      crighjc ALL=(root) NOPASSWD: /usr/bin/systemctl restart coc, /usr/bin/systemctl reload nginx
#
#    Then check it: sudo -n systemctl restart coc
#
# Note that GitHub's runners use a wide, changing set of IP addresses, so this
# needs port 22 reachable from the internet. If you would rather not have that,
# see the systemd timer in deploy/coc-update.timer — it pulls instead of being
# pushed to, needs no secrets, and opens nothing.

name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would race on git, node_modules and
# the build directory, and the loser could leave a half-built tree being served.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ci, not install: exactly the lockfile, and it never rewrites it.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Catches a build that fails only in a clean checkout — a missing tracked
      # file, say. The artwork is absent here, which is fine: this proves the
      # bundle compiles, and the host checks the art before it builds for real.
      - run: npm run build

  deploy:
    name: Deploy to the droplet
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Run the host's own deploy script over SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY" && test -n "$HOST" && test -n "$USER" && test -n "$KNOWN_HOSTS" \
            || { echo "::error::One of the DEPLOY_* secrets is unset — see the comment at the top of this file."; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # -T: no pseudo-terminal, so the script's output comes back cleanly and
          # a hung remote cannot wedge the runner waiting on a prompt.
          ssh -T -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            "$USER@$HOST" 'cd /srv/coc && ./deploy/update.sh'
