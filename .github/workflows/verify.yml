# Typecheck, lint, test and build on every push and pull request.
#
# **This does not deploy.** Deployment is the droplet's own `coc-update.timer`, which
# runs `deploy/update.sh` — see deploy/README.md. This workflow exists for the one
# thing the timer cannot do: tell you a commit is broken before you have to notice it
# in production.
#
# It previously had a second job that SSHed in and deployed. That was a mistake in
# this setup: the deploy secrets were never configured, so the job failed within five
# seconds of every push and emailed a failure notice each time — noise that trains you
# to ignore the one signal this workflow is for. The timer is the deploy path; a
# dormant second one earns nothing and costs attention.
#
# If you ever do want push-triggered deployment, the recipe is in deploy/README.md
# under "What CI does, and does not, do", and the job that did it is in this file's git
# history at commit 5e6c1b2. It needs four repository secrets and a sudoers rule before
# it will do anything but fail.

name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run when a newer commit lands: only the tip matters, and a
# queue of runs on superseded commits is more noise.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # An exact patch, not '22'. The whole persistence layer is `node:sqlite`, which is
      # still experimental and has changed API across Node 22, 23 and 24 — it is the one
      # dependency with no fallback, so the runtime is the last thing that should drift
      # underneath a test run. '22' would silently follow whatever 22.x shipped this
      # week and report the change as a failure on a commit that did not cause it.
      # It is 22 rather than 24 because production is: deploy/README.md installs Node
      # from deb.nodesource.com/setup_22.x, and CI is only worth trusting where it runs
      # the major the droplet runs. Read straight from .nvmrc so there is nothing left to
      # keep in sync by hand — Renovate still bumps both together
      # (.github/renovate.json), but a hand-edit of .nvmrc alone now takes effect here
      # too, instead of silently diverging until the next Renovate run.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: exactly the lockfile, and it never rewrites it.
      - run: npm ci

      - run: npm run typecheck

      # Ahead of the tests, because a lint failure is cheap to read and a test failure
      # is not: if both break on one commit, the twenty lines of rule names are the
      # ones you want first. Warnings fail it too (`--max-warnings 0` in the script) —
      # a warning nothing enforces is a comment, and this is the only thing that
      # enforces anything here. See eslint.config.js for what is on and why.
      - run: npm run lint

      # `npm run format:check` is deliberately **not** a step, and this comment is here
      # so that reads as a decision rather than an omission.
      #
      # Prettier is configured to match the code as it was already written — 100
      # columns, no semicolons, single quotes, all measured off the source rather than
      # picked (see prettier.config.js). It still wants to rewrite 61 of the 142 code
      # files, about 1,100 lines. Almost none of that is disagreement about style: it
      # is that Prettier decides line breaks by an algorithm and this code was laid out
      # by hand *within* the same 100 columns. Discriminated unions written one member
      # per line get collapsed onto one; hand-wrapped English inside JSX gets reflowed;
      # imports and prop types broken up for readability get joined back.
      #
      # Gating CI on it means committing that reformat, which would bury every real
      # change in the diff it landed with. So the scripts exist — run `npm run format`
      # on a branch of its own if the reformat is ever wanted, and `format:check` will
      # pass from that commit on — and CI checks the things that can fail for a reason.
      - run: npm test

      # Catches a build that only fails in a clean checkout — a missing tracked file,
      # say. The artwork is absent here, which is fine: this proves the bundle
      # compiles. The host checks the art is present before it builds for real.
      - run: npm run build
